name: Deploy jgc-lumen.de zu GitHub Pages

# Seit 02.09.2026 ist die Scroll-Reise die einzige Fassung der Seite. Der Workflow
# setzt nur noch zusammen, was scripts/deploy/baue-site.mjs beschreibt (Reise an
# der Wurzel, Stilprobe, Rechtsseiten, Vorschaubild, Weiterleitung, robots.txt,
# Sitemap) und prueft das Ergebnis. Kein npm, kein Astro, keine Varianten mehr —
# die bleiben im Repo als Archiv. Dasselbe Skript laeuft lokal, das Ergebnis
# laesst sich also vor dem Push ansehen (launch.json "site-vorschau").

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  # Ueberlappende Laeufe abbrechen, damit der neuere Push immer gewinnt.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Seite zusammensetzen
        run: node scripts/deploy/baue-site.mjs _site

      - name: Qualitaetspruefung der ausgelieferten Seiten
        # Bricht ab bei: Sprungmarke ohne Ziel, fehlendem Kontaktweg, canonical
        # abweichend von der Soll-Adresse, noindex auf einer echten Seite, altem
        # GitHub-Praefix, internem Link ohne Ziel-Datei, Sitemap/robots.txt kaputt.
        run: node scripts/pruefe-seiten.mjs _site

      - name: Ergebnis auflisten
        run: |
          find _site -maxdepth 2 -type d | sort
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
